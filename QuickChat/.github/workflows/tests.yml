name: Part 2 Tests
on: 
  push:
    branches : ["khanbanTasks"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        java-version: '17'
    - run: javac -cp test/junit-4.13.2.jar:test/hamcrest-core-1.3.jar src/quickchat/*.java test/quickchat/MessageTest.java
    - run: java -cp.:test/junit-4.13.2.jar:test/hamcrest-core-1.3.jar org.junit.runner.JUnitCore quickchat.MessageTest
    



