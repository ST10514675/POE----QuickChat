name: Part 2 Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: javac -cp .:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar src/quickchat/*.java test/quickchat/*.java
      - run: java -cp .:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar org.junit.runner.JUnitCore quickchat.MessageTest
