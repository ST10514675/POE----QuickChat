name: Part 2 Tests
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile source and test files
        run: javac -cp .:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar -d . src/quickchat/*.java test/quickchat/*.java

      - name: Run JUnit tests
        run: java -cp .:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar org.junit.runner.JUnitCore quickchat.MessageTest
