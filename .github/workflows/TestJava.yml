name: PoE Final Tests
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QuickChat
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download JUnit jars
        run: |
          mkdir -p lib
          curl -L -o lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -L -o lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Create output directory
        run: mkdir -p out

      - name: Compile source and test files
        run: javac -cp .:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar -d out src/quickchat/*.java test/quickchat/*.java

      - name: Run Part 1 Login Tests
        run: java -cp out:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar org.junit.runner.JUnitCore quickchat.LoginTest

      - name: Run Part 2 and 3 Message Tests
        run: java -cp out:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar org.junit.runner.JUnitCore quickchat.messageTest
