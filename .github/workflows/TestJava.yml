name: PoE Final Tests

on:
  push:
    branches: [ Part_3_POE ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Set up Ant
      run: sudo apt-get install ant -y
    - name: Build and Test with Ant
      run: ant test
